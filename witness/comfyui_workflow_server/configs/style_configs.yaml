# 风格工作流配置文件
# 极简配置 - 只保留核心必要信息

styles:
  clay_style_transform:
    name: "黏土风格转换"
    description: "将输入图像转换为黏土风格的图像，呈现可爱、3D、立体效果"
    workflow_file: "clay_style_transform.json"
    estimated_time: 45
    tags: ["黏土风格", "3D效果", "可爱"]
  
  anime_style_transform:
    name: "动漫风格转换"
    description: "将输入图像转换为动漫风格的图像，呈现鲜艳色彩和漫画风格"
    workflow_file: "anime_style_transform.json"
    estimated_time: 45
    tags: ["动漫风格", "漫画", "动画"]

