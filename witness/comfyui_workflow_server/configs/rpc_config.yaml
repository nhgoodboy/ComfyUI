# ComfyUI工作流服务器 RPC 配置文件
# 基于微服务架构的配置管理

# 文件处理配置
files:
  # 下载配置
  download:
    # 下载超时时间（秒）
    timeout: 30
    
    # 最大文件大小（字节，10MB）
    max_file_size: 10485760
    
    # 允许的文件格式
    allowed_formats: 
      - ".jpg"
      - ".jpeg" 
      - ".png"
      - ".webp"
      - ".bmp"
      - ".gif"
    
    # HTTP请求配置
    user_agent: "ComfyUI-Workflow-Server/2.0"
    max_redirects: 3
    max_concurrent_downloads: 5
  
  # 文件命名配置（已简化为 request_id + type）
  naming:
    # 文件命名模式（新简化模式）
    pattern: "{request_id}_{type}.{ext}"
    
    # 是否验证文件名格式
    validate_naming: true
    
    # 允许的文件类型
    allowed_types:
      - "input"
      - "output"
    
    # 文件名验证正则表达式
    validation_regex: "^[a-zA-Z0-9\\-]+_(input|output)\\.[a-zA-Z0-9]+$"
  
  # 文件清理配置
  cleanup:
    # 临时文件保留时间（小时）
    temp_retention_hours: 2
    # 输入文件保留时间（天）
    input_retention_days: 7
    # 输出文件保留时间（天）
    output_retention_days: 30
    # 是否启用自动清理
    auto_cleanup: true
    # 清理任务执行间隔（小时）
    cleanup_interval_hours: 6

# 工作流任务配置  
workflow:
  # 最大并发工作流任务数
  max_concurrent_tasks: 3
  
  # 任务超时时间（秒）
  task_timeout: 300
  
  # 任务状态检查间隔（秒）
  status_check_interval: 2
  
  # 是否自动清理临时文件
  cleanup_temp_files: true
  
  # 任务清理配置
  task_cleanup:
    # 已完成任务保留时间（小时）
    completed_max_age_hours: 24
    # 失败任务保留时间（小时）
    failed_max_age_hours: 48
    # 是否启用自动清理
    auto_cleanup: true
    # 清理任务执行间隔（小时）
    cleanup_interval_hours: 12
  
  # 结果缓存配置
  result_cache:
    # 是否启用结果缓存
    enabled: true
    # 缓存保留时间（小时）
    retention_hours: 12
    # 最大缓存条目数
    max_entries: 1000

# RPC通信配置
rpc:
  # 是否启用批量请求
  enable_batch_requests: true
  
  # 单次批量请求最大数量
  max_batch_size: 10
  
  # 请求超时时间（秒）
  request_timeout: 60
  
  # 是否记录详细日志
  verbose_logging: false
  
  # 错误处理配置
  error_handling:
    # 是否返回详细错误信息（调试模式）
    detailed_errors: true
    # 是否记录错误堆栈
    log_stack_traces: true
  
  # 验证配置
  validation:
    # 是否严格验证参数
    strict_validation: true
    # 是否允许额外参数
    allow_extra_params: false

# WebSocket推送配置
websocket:
  # 连接超时时间（秒）
  connection_timeout: 30
  
  # 心跳间隔（秒）
  ping_interval: 30
  
  # 心跳超时（秒）
  ping_timeout: 10
  
  # 最大连接数
  max_connections: 100
  
  # 消息队列大小
  message_queue_size: 1000
  
  # 是否启用消息压缩
  enable_compression: false

# 系统监控配置
monitoring:
  # 健康检查配置
  health_check:
    # 检查间隔（秒）
    interval: 30
    # ComfyUI连接检查超时（秒）
    comfyui_timeout: 10
  
  # 统计信息配置
  statistics:
    # 是否启用详细统计
    detailed_stats: true
    # 统计数据保留时间（小时）
    retention_hours: 24
  
  # 性能监控
  performance:
    # 是否启用性能监控
    enabled: true
    # 慢请求阈值（秒）
    slow_request_threshold: 5.0

# 安全配置
security:
  # 文件上传安全
  file_upload:
    # 是否检查文件MIME类型
    check_mime_type: true
    # 是否扫描恶意文件
    scan_malware: false
    # 最大文件名长度
    max_filename_length: 255
  
  # API安全
  api:
    # 是否启用请求频率限制
    enable_rate_limiting: false
    # 每分钟最大请求数
    max_requests_per_minute: 60