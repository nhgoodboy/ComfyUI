# 通用工作流配置文件
# 基于参数化配置的工作流管理系统

workflows:
  clay_style_transform:
    name: "黏土风格转换"
    description: "将输入图像转换为黏土风格的图像，呈现可爱、3D、立体效果"
    template_file: "clay_style_transform.json"
    estimated_time: 45
    tags: ["风格转换", "黏土风格", "3D效果", "可爱"]
    version: "1.0.0"
    
    # 可配置参数定义
    parameters:
      input_image:
        type: "file"
        description: "输入图像文件"
        node_path: "1.inputs.image"
        required: true
        validation:
          accept: ["jpg", "jpeg", "png", "webp"]

  anime_style_transform:
    name: "动漫风格转换"
    description: "将输入图像转换为动漫风格的图像，呈现鲜艳色彩和漫画风格"
    template_file: "anime_style_transform.json"
    estimated_time: 45
    tags: ["风格转换", "动漫风格", "漫画", "动画"]
    version: "1.0.0"
    
    parameters:
      input_image:
        type: "file"
        description: "输入图像文件"
        node_path: "1.inputs.image"
        required: true
        validation:
          accept: ["jpg", "jpeg", "png", "webp"]

  person_scene_merge:
    name: "人物场景融合"
    description: "将人物图片与场景图片融合，创造新的合成图像"
    template_file: "person_scene_merge.json"
    estimated_time: 60
    tags: ["图像融合", "人物融合", "场景合成", "双图处理"]
    version: "1.0.0"
    
    parameters:
      person_image:
        type: "file"
        description: "人物图片"
        node_path: "31.inputs.image"
        required: true
        validation:
          accept: ["jpg", "jpeg", "png", "webp"]
      
      scene_image:
        type: "file"
        description: "场景图片"
        node_path: "30.inputs.image"
        required: true
        validation:
          accept: ["jpg", "jpeg", "png", "webp"]
      
      prompt:
        type: "string"
        description: "融合效果描述"
        default: "person in scenic environment, natural integration"
        node_path: "27.inputs.text"
        required: false 