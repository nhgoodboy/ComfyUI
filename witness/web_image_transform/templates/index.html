<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图像风格转换</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎨</text></svg>">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎨 图像风格转换</h1>
            <p>上传一张图片，选择一种艺术风格，见证AI的魔力！</p>
        </header>

        <main>
            <div class="card">
                <h2>1. 上传图片</h2>
                <form id="upload-form" class="form-grid">
                    <div class="form-group file-drop-area">
                        <input type="file" id="image-input" name="image" accept="image/*" required>
                        <label for="image-input" id="file-label">
                            <span id="file-preview">
                                <strong>点击或拖拽</strong><br>上传图片
                            </span>
                        </label>
                    </div>
                    
                    <div class="form-group">
                        <label for="style-select">2. 选择风格</label>
                        <select id="style-select" name="style_id" required>
                            <option value="" disabled selected>正在加载风格...</option>
                        </select>
                    </div>
                    
                    <button type="submit" id="submit-btn" class="submit-btn" disabled>开始转换</button>
                </form>
            </div>

            <div id="status-card" class="card status-card" style="display: none;">
                <h2>实时状态</h2>
                <div id="progress-container" class="progress-container" style="display: none;">
                    <div id="progress-bar" class="progress-bar"></div>
                </div>
                <p id="status-message">等待任务开始...</p>
            </div>

            <div id="result-card" class="card result-card" style="display: none;">
                <h2>转换结果</h2>
                <div class="image-container">
                    <div class="image-wrapper">
                        <h3>原始图片</h3>
                        <img id="original-image" src="" alt="原始图片">
                    </div>
                    <div class="image-wrapper">
                        <h3>风格化图片</h3>
                        <img id="result-image" src="" alt="转换结果">
                        <a id="download-link" class="download-btn" href="" download="stylized_image.png">下载图片</a>
                    </div>
                </div>
            </div>
        </main>

        <footer>
            <p>由 ComfyUI Workflow Server 提供技术支持</p>
        </footer>
    </div>
    <script src="/static/js/main.js"></script>
</body>
</html>
