<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图像风格转换</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .upload-area {
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .upload-area:hover {
            background-color: #f8f9fa;
            border-color: #007bff;
        }
        .drag-over {
            background-color: #e3f2fd !important;
            border-color: #2196f3 !important;
        }
        #image-preview img {
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        #file-name {
            font-size: 14px;
            font-weight: normal;
        }
    </style>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎨</text></svg>">
    <script>
        window.CLIENT_ID = "{{ client_id }}";
    </script>
</head>
<body data-client-id="{{ client_id }}">
    <div class="container">
        <header class="header">
            <div class="header-content">
                <h1><i class="fas fa-palette"></i> 图像风格转换</h1>
            </div>
        </header>

        <main class="main-content">
            <div class="upload-card">
                <form id="upload-form">
                    <div class="form-group">
                        <label for="image-input" class="upload-area">
                            <div class="upload-content">
                                <i class="fas fa-upload upload-icon"></i>
                                <h3>点击或拖拽以上传图片</h3>
                                <p>支持PNG, JPG, WEBP等格式</p>
                                <span class="upload-btn">选择文件</span>
                                <span id="file-name" style="margin-top: 10px; display: inline-block;"></span>
                            </div>
                            <input type="file" id="image-input" name="image" accept="image/*" required hidden>
                        </label>
                        <!-- 添加图片预览容器 -->
                        <div id="image-preview" style="margin-top: 15px; text-align: center; display: none;"></div>
                    </div>

                    <div class="form-group">
                        <label for="style-select">选择艺术风格</label>
                        <select id="style-select" name="style_id" class="form-control" required>
                            <option value="" disabled selected>正在加载风格...</option>
                        </select>
                    </div>

                    <button type="submit" id="submit-btn" class="transform-btn" disabled>
                        <i class="fas fa-magic"></i> 开始转换
                    </button>
                </form>
            </div>

            <div id="status-card" class="progress-card" style="display: none;">
                <h2><i class="fas fa-spinner fa-spin"></i> 实时状态</h2>
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <div class="progress-info">
                    <span id="progress-text">0%</span>
                    <div id="task-info">等待任务开始...</div>
                </div>
            </div>

            <div id="result-card" class="result-card" style="display: none;">
                <h2><i class="fas fa-check-circle"></i> 转换结果</h2>
                <div class="image-comparison">
                    <div class="image-container">
                        <h4>原始图片</h4>
                        <img id="original-image" src="" alt="原始图片">
                    </div>
                    <div class="image-container">
                        <h4>风格化图片</h4>
                        <img id="result-image" src="" alt="转换结果">
                    </div>
                </div>
                <div class="image-actions">
                    <a id="download-link" class="download-btn" href="" download="stylized_image.png">
                        <i class="fas fa-download"></i> 下载图片
                    </a>
                </div>
            </div>
        </main>

        <footer class="footer">
            <div class="footer-content">
                <p class="system-info">由 ComfyUI Workflow Server 提供技术支持</p>
            </div>
        </footer>
    </div>
    <script src="/static/js/app.js?v=1752982700"></script>
</body>
</html>
